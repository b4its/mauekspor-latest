services:
  db:
    image: postgres:16-alpine
    container_name: mauekspor-db
    profiles: ["full", "dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mauekspor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mauekspor}
      POSTGRES_DB: ${POSTGRES_DB:-mauekspor}
    ports:
      - "5447:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mauekspor} -d ${POSTGRES_DB:-mauekspor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: mauekspor-backend
    profiles: ["full", "dev"]
    # Host network: backend memakai network stack host sehingga bisa menjangkau
    # AI server lokal (localhost:20128) dan menghindari firewall Docker bridge
    # yang memblokir container->host. Backend langsung bind 0.0.0.0:8000 di host.
    # NB: dengan network_mode: host, backend mengakses db via localhost:5447.
    network_mode: host
    environment:
      MAUEKSPOR_SECRET_KEY: ${MAUEKSPOR_SECRET_KEY:-change-me-in-production}
      MAUEKSPOR_DATABASE_URL: postgresql://${POSTGRES_USER:-mauekspor}:${POSTGRES_PASSWORD:-mauekspor}@localhost:5447/${POSTGRES_DB:-mauekspor}
      MAUEKSPOR_UPLOAD_DIR: /app/uploads
      MAUEKSPOR_CORS_ORIGINS: '["http://localhost:5188","http://localhost:3016"]'
      MAUEKSPOR_AI_MODE: ${MAUEKSPOR_AI_MODE:-remote}
      MAUEKSPOR_AI_API_KEY: ${MAUEKSPOR_AI_API_KEY:?Set MAUEKSPOR_AI_API_KEY in .env}
      MAUEKSPOR_AI_BASE_URL: ${MAUEKSPOR_AI_BASE_URL:-http://localhost:20128/v1}
      MAUEKSPOR_AI_MODEL: ${MAUEKSPOR_AI_MODEL:-qd/dmodel}
      # Keamanan: aktifkan CSRF (default off, Bearer adalah auth utama)
      MAUEKSPOR_ENABLE_CSRF: ${MAUEKSPOR_ENABLE_CSRF:-0}
      # Cookie Secure (set 1 saat di belakang HTTPS)
      MAUEKSPOR_COOKIE_SECURE: ${MAUEKSPOR_COOKIE_SECURE:-0}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mauekspor-frontend
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "${DEV_FRONTEND_PORT:-3016}:3000"
    environment:
      ORIGIN: http://localhost:${DEV_FRONTEND_PORT:-3016}
    restart: unless-stopped

  # ── Frontend DEV (hot reload) ──────────────────────────────────────
  # Jalankan: docker compose --profile dev up -d db backend frontend-dev
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mauekspor-frontend-dev
    profiles: ["dev"]
    depends_on:
      - backend
    ports:
      - "5188:5188"
    environment:
      VITE_API_BASE_URL: /api/v1
      # Proxy langsung ke container backend production (container-to-container,
      # TIDAK lewat host — firewall host memblokir container→host traffic).
      # Butuh external network dari docker-compose.production.yml:
      #   docker network connect mauekspor_mauekspor-backend mauekspor-frontend-dev
      BACKEND_ORIGIN: http://mauekspor-backend-prod:8000
      HOST: 0.0.0.0
      PORT: 5188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Mount source untuk hot reload; node_modules tetap dari image (anonymous volume)
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped
    networks:
      - default
      - mauekspor-prod-net

networks:
  mauekspor-prod-net:
    external: true
    name: mauekspor-prod_mauekspor-backend

volumes:
  db-data:
  backend-uploads:
  frontend-node-modules:
