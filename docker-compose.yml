services:
  db:
    image: postgres:16-alpine
    container_name: mauekspor-db
    profiles: ["full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mauekspor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mauekspor}
      POSTGRES_DB: ${POSTGRES_DB:-mauekspor}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mauekspor} -d ${POSTGRES_DB:-mauekspor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: mauekspor-backend
    profiles: ["full"]
    # Host network: backend memakai network stack host sehingga bisa menjangkau
    # AI server lokal (localhost:20128) dan menghindari firewall Docker bridge
    # yang memblokir container->host. Backend langsung bind 0.0.0.0:8000 di host.
    # NB: dengan network_mode: host, backend mengakses db via localhost:5432.
    network_mode: host
    environment:
      MAUEKSPOR_SECRET_KEY: ${MAUEKSPOR_SECRET_KEY:-change-me-in-production}
      MAUEKSPOR_DATABASE_URL: postgresql://${POSTGRES_USER:-mauekspor}:${POSTGRES_PASSWORD:-mauekspor}@localhost:5432/${POSTGRES_DB:-mauekspor}
      MAUEKSPOR_UPLOAD_DIR: /app/uploads
      MAUEKSPOR_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      MAUEKSPOR_AI_MODE: ${MAUEKSPOR_AI_MODE:-mock}
      MAUEKSPOR_AI_API_KEY: ${MAUEKSPOR_AI_API_KEY:-}
      MAUEKSPOR_AI_BASE_URL: ${MAUEKSPOR_AI_BASE_URL:-http://localhost:20128/v1}
      MAUEKSPOR_AI_MODEL: ${MAUEKSPOR_AI_MODEL:-gpt-4o-mini}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: mauekspor-frontend
    profiles: ["full"]
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      ORIGIN: http://localhost:3000
    restart: unless-stopped

volumes:
  db-data:
  backend-uploads:
