name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Run all tests
        run: bash scripts/test.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mauekspor-backend ./backend

      - name: Build frontend image
        run: docker build -t mauekspor-frontend ./frontend

      - name: Smoke test backend container
        run: |
          docker run -d --rm --name mauekspor-backend -p 8015:8000 mauekspor-backend
          sleep 5
          curl -fsS -o /dev/null http://localhost:8015/docs
          curl -fsS -X POST http://localhost:8015/api/v1/auth/login/ \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@mauekspor.example","password":"admin123"}' -o /dev/null
          docker rm -f mauekspor-backend

      - name: Smoke test frontend container
        run: |
          docker run -d --rm --name mauekspor-frontend -p 3015:3000 mauekspor-frontend
          sleep 5
          curl -fsS -o /dev/null http://localhost:3015/
          curl -fsS -o /dev/null http://localhost:3015/dashboard
          docker rm -f mauekspor-frontend