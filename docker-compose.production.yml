# MauEkspor Docker Compose - Production Mode with Nginx Reverse Proxy
#
# PORT LAYOUT (tidak tabrakan dengan dev services):
#   db         : host 5447 -> container 5432
#   backend    : host 8015 -> container 8000
#   frontend   : host 3015 -> container 3000
#   nginx      : host 8080 -> container 80
#
# Dev services (local, BUKAN container ini):
#   backend    : 8016  (uvicorn --port 8016)
#   frontend   : 5188  (vite dev --port 5188)
#
# Ngrok tunnel: localhost:8080 (nginx) -> public URL

services:
  # ── DATABASE (PostgreSQL) ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mauekspor-db-prod
    ports:
      - "${DB_PORT:-5447}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mauekspor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mauekspor}
      POSTGRES_DB: ${POSTGRES_DB:-mauekspor}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mauekspor} -d ${POSTGRES_DB:-mauekspor}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - mauekspor-backend

  # ── BACKEND API (FastAPI) ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: mauekspor-backend-prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8015}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Local resolver NXDOMAINs *.trycloudflare.com (AI quick-tunnel domain).
    # Public DNS resolves it correctly — containers inherit the broken local
    # resolver by default, so pin public DNS for the backend.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Override via .env — do NOT hardcode secrets here
      MAUEKSPOR_SECRET_KEY: ${MAUEKSPOR_SECRET_KEY:-change-me-in-production}
      MAUEKSPOR_DATABASE_URL: postgresql://${POSTGRES_USER:-mauekspor}:${POSTGRES_PASSWORD:-mauekspor}@db:5432/${POSTGRES_DB:-mauekspor}
      MAUEKSPOR_UPLOAD_DIR: /app/uploads
      # Izinkan request dari localhost, ngrok, cloudflare tunnel, dan ngrok-free.app
      MAUEKSPOR_CORS_ORIGINS: >-
        ["http://localhost",
         "http://localhost:8080",
         "http://localhost:3015",
         "http://localhost:5188",
         "https://*.ngrok-free.app",
         "https://*.ngrok.io",
         "https://*.trycloudflare.com"]
      MAUEKSPOR_AI_MODE: ${MAUEKSPOR_AI_MODE:-remote}
      MAUEKSPOR_AI_API_KEY: ${MAUEKSPOR_AI_API_KEY}
      # AI_BASE_URL: set to MAUEKSPOR_AI_PUBLIC_URL from ngrok tunnel, or host.docker.internal
      MAUEKSPOR_AI_BASE_URL: ${MAUEKSPOR_AI_PUBLIC_URL:-http://host.docker.internal:20128/v1}
      MAUEKSPOR_AI_MODEL: ${MAUEKSPOR_AI_MODEL:-qd/dmodel}
      MAUEKSPOR_ENABLE_CSRF: ${MAUEKSPOR_ENABLE_CSRF:-0}
      MAUEKSPOR_COOKIE_SECURE: ${MAUEKSPOR_COOKIE_SECURE:-0}
    volumes:
      - backend-prod-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    networks:
      - mauekspor-backend

  # ── FRONTEND PRODUCTION BUILD ──────────────────────────────────────
  frontend-prod:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mauekspor-frontend-prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3015}:3000"
    environment:
      # Derive origin dari X-Forwarded-* header (set oleh nginx)
      # Diperlukan agar SvelteKit SSR tahu base URL saat diakses via ngrok
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PORT: "3000"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ | head -c 1 | grep -q . || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - mauekspor-backend

  # ── NGINX REVERSE PROXY ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mauekspor-nginx-prod
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m
    networks:
      - mauekspor-backend

volumes:
  db-prod-data:
  backend-prod-uploads:

networks:
  mauekspor-backend:
    driver: bridge
