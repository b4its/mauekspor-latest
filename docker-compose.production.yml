# MauEkspor Docker Compose - Production Mode with Nginx Reverse Proxy
# Architecture:
#   - Frontend at / (root)  
#   - Backend API at /backend
#   - Nginx acts as reverse proxy
#   - Ngrok exposes nginx to public internet

services:
  # ── DATABASE (PostgreSQL) ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mauekspor-db-prod
    ports:
      - "5447:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mauekspor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mauekspor}
      POSTGRES_DB: ${POSTGRES_DB:-mauekspor}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mauekspor} -d ${POSTGRES_DB:-mauekspor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - mauekspor-backend

  # ── BACKEND API (FastAPI) ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: mauekspor-backend-prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8015:8000"
    environment:
      MAUEKSPOR_SECRET_KEY: ${MAUEKSPOR_SECRET_KEY:-change-me-in-production}
      MAUEKSPOR_DATABASE_URL: postgresql://${POSTGRES_USER:-mauekspor}:${POSTGRES_PASSWORD:-mauekspor}@db:5432/${POSTGRES_DB:-mauekspor}
      MAUEKSPOR_UPLOAD_DIR: /app/uploads
      MAUEKSPOR_CORS_ORIGINS: '["http://localhost","https://*.ngrok-free.app","https://*.trycloudflare.com"]'
      MAUEKSPOR_AI_MODE: ${MAUEKSPOR_AI_MODE:-remote}
      MAUEKSPOR_AI_API_KEY: ${MAUEKSPOR_AI_API_KEY:-sk-dede08aea594e222-upk4p8-5bfa2c54}
      MAUEKSPOR_AI_BASE_URL: ${MAUEKSPOR_AI_BASE_URL:-http://host.docker.internal:20128/v1}
      MAUEKSPOR_AI_MODEL: ${MAUEKSPOR_AI_MODEL:-qd/dmodel}
      MAUEKSPOR_ENABLE_CSRF: ${MAUEKSPOR_ENABLE_CSRF:-0}
      MAUEKSPOR_COOKIE_SECURE: ${MAUEKSPOR_COOKIE_SECURE:-0}
    volumes:
      - backend-prod-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - mauekspor-backend

  # ── FRONTEND PRODUCTION BUILD ──────────────────────────────────────
  frontend-prod:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mauekspor-frontend-prod
    depends_on:
      - backend
    ports:
      - "3015:3000"
    environment:
      # Derive origin dari header proxy (X-Forwarded-*) agar valid juga
      # saat diakses via ngrok / domain publik
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    restart: unless-stopped
    networks:
      - mauekspor-backend

  # ── NGINX REVERSE PROXY ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mauekspor-nginx-prod
    ports:
      - "8080:80"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-prod:
        condition: service_started
    restart: unless-stopped
    networks:
      - mauekspor-backend

volumes:
  db-prod-data:
  backend-prod-uploads:

networks:
  mauekspor-backend:
    driver: bridge
