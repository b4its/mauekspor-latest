version: '3.8'

# Docker Compose untuk AI Service (LocalAI)
# Jalankan ini agar backend Docker bisa akses AI tanpa host.docker.internal issues

services:
  localai:
    image: localai/localai:latest-aio-cpu
    container_name: mauekspor-ai
    ports:
      - "20128:8080"
    environment:
      - THREADS=4
      - CONTEXT_SIZE=2048
    volumes:
      - localai-models:/build/models
      - ./models:/models
    networks:
      - mauekspor-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  localai-models:
    driver: local

networks:
  mauekspor-backend:
    external: true
    name: mauekspor_mauekspor-backend
